# Deploys the web version (index.html + web/ + src/) to GitHub Pages.
# No build step and no npm dependencies: the site is plain ES modules and
# JSON, served exactly as they sit in the repository.
#
# `enablement: true` lets configure-pages turn Pages on by itself (the
# one-time Settings -> Pages -> Source: GitHub Actions step is not needed).
name: Deploy web version to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r web _site/web
          cp -r src _site/src

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
