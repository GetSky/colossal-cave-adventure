# Deploys the web version (index.html + web/ + src/) to GitHub Pages.
# No build step and no npm dependencies: the site is plain ES modules and
# JSON, served exactly as they sit in the repository.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy web version to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r web _site/web
          cp -r src _site/src

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
